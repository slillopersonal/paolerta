title: "La Mappa del Malandrino"
description: "Caccia al tesoro per l'addio al celibato/nubilato"

# Senza questa riga Jekyll (dalla 3.2 in poi) applica di default il tema
# "minima": il suo assets/css/style.scss viene compilato proprio su
# assets/css/style.css, sovrascrivendo il nostro foglio di stile custom.
theme: null

# In locale vogliamo l'URL a "/" (baseurl vuoto). In produzione ci pensa
# già il workflow GitHub Actions (.github/workflows/jekyll.yml), che builda
# con `--baseurl` preso da actions/configure-pages: quel flag da riga di
# comando sovrascrive comunque questo valore, quindi qui basta lasciarlo
# vuoto e non serve toccare nulla quando si pubblica.
baseurl: ""

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
